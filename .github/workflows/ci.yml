name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Integration tests need the real Supabase project; the dataset tests skip without data/.
      - name: Run pytest with coverage
        run: >
          pytest -m "not integration"
          --cov=api --cov=simulator --cov=ml --cov-branch
          --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  web:
    name: Web lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t fraud-api .
      - name: Image size and user
        run: |
          docker image ls fraud-api --format '{{.Size}}'
          test "$(docker run --rm fraud-api id -u)" != "0"
      # Same as Render: PORT is set by the platform, no Supabase (storage off).
      - name: Start and check /health
        run: |
          docker run -d --name api -e PORT=10000 -p 10000:10000 fraud-api
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:10000/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:10000/health | grep -q '"model_loaded":true'
          curl -fsS -X POST http://localhost:10000/predict \
            -H 'Content-Type: application/json' -d @docs/examples/transaction.json
      - name: Container logs
        if: always()
        run: docker logs api || true
